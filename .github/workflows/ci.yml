name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          # Placeholder só para o CI; o build de produção usa o domínio real (LR-02)
          NEXT_PUBLIC_SITE_URL: https://example.com
      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/privacidade/index.html
          test ! -f out/privacidade.html
          test -f out/_headers
          test -f out/.htaccess

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://galmarlimpeza.com.br
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      # Conta FTP principal entra em /home/galmarlimpeza, então o destino é public_html/.
      # dangerous-clean-slate fica desligado: apagaria cgi-bin e php.ini.
      - name: Publish out/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: public_html/
          timeout: 60000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cgi-bin/**
            php.ini
